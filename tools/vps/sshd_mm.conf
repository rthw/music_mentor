# Ученики входят только по ключу; сессия сразу запускает наставника. Все они — в группе mentors
# (их заводит new_learner.sh), поэтому новый ученик не требует правки конфига.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowGroups mentors
AllowTcpForwarding remote
GatewayPorts no
X11Forwarding no
AcceptEnv LANG LC_*
Match Group mentors
	ForceCommand /usr/local/bin/mentor_login
